name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-sanity:
    name: Numerical sanity checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Verify environment
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Compile Python source
        run: |
          python -m compileall -q .

      - name: Run pytest if tests exist
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      - name: Locate discrete proof
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

      - name: Numerical sanity checks
        shell: bash
        run: |
          set -e

          if [ -f ./discrete_proof.py ]; then
            python ./discrete_proof.py
          elif [ -f ./shell_audit.py ]; then
            python ./shell_audit.py
          else
            echo "No standalone numerical entry point found."
            echo "Source compilation completed successfully."
          fi

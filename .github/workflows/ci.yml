name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  numerical-sanity:
    name: Numerical sanity checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install numpy pytest

      - name: Verify Python environment
        run: |
          python --version
          python -c "import numpy; print('NumPy', numpy.__version__)"

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Run tests if present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      - name: Numerical sanity checks
        shell: bash
        run: |
          set -e

          if [ -f discrete_proof.py ]; then
            python discrete_proof.py
          elif [ -f input_file_0.py ]; then
            python input_file_0.py
          else
            echo "No standalone discrete proof entry point found."
            echo "Compilation and available tests have already been checked."
          fi

      - name: Check repository status
        run: |
          git status --short
